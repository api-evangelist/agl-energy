- aid: agl-energy:agl-cdr-discovery-api
  name: AGL CDR Discovery (Common) API
  description: >-
    The unauthenticated half of AGL's Consumer Data Right implementation, served from
    its CDR public base URI and conforming to the DSB Consumer Data Standards CDR
    Common API v1.36.0. GET /cds-au/v1/discovery/status returned HTTP 200 on
    2026-07-27 with {"status":"OK","explanation":"All services operational"}, and GET
    /cds-au/v1/discovery/outages returned HTTP 200 with six scheduled outage windows
    authored by AGL describing unavailability of the AGL CDR consent flow. No API key,
    no accreditation and no consent is needed to call these two endpoints — they are
    the only anonymously reachable API AGL itself operates. The /common/customer
    endpoints in the same standard are consumer-authorised and return HTTP 404 on the
    public base URI.
  humanURL: https://consumerdatastandardsaustralia.github.io/standards/
  baseURL: https://public.cdr.agl.com.au/cds-au/v1
