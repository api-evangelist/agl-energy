- aid: agl-energy:agl-energy-product-reference-data-api
  name: AGL Energy Product Reference Data (PRD) API
  description: >-
    AGL's retail energy plans published as anonymous, machine-readable Consumer Data
    Right Product Reference Data. Verified live on 2026-07-27: GET
    /energy/plans?page-size=10 returned HTTP 200 with x-v:1, meta.totalRecords 1343
    across 135 pages, CORS Access-Control-Allow-Origin *, and plan detail for
    planId AGL1067320MRE2@EME returned HTTP 200 at x-v:3. Critically, this endpoint is
    NOT operated by AGL — the Australian Energy Regulator hosts every retailer's PRD
    centrally at cdr.energymadeeasy.gov.au under a per-brand path, which is the
    structural break from CDR banking where each ADI serves its own product API from
    its own domain. AGL's own public base URI returns HTTP 404 for /cds-au/v1/energy/plans.
  humanURL: https://www.aer.gov.au/energy-product-reference-data
  baseURL: https://cdr.energymadeeasy.gov.au/agl/cds-au/v1
