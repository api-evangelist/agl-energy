breaking_change_mechanism:
  detail: >-
    The Consumer Data Standards do not break a released endpoint version. A
    breaking change ships as a NEW integer endpoint version, negotiated per
    request via x-v / x-min-v, with a published Future Dated Obligation naming
    the date data holders MUST implement the new version and the date they MAY
    retire the old one. See lifecycle/agl-energy-lifecycle.yml.
  future_dated_obligations: https://consumerdatastandardsaustralia.github.io/standards/#future-dated-obligations
