description: >-
  AGL publishes no changelog, no release notes and no API version history of its
  own — it has no developer portal to publish them on. The contract AGL serves is
  versioned entirely by the Data Standards Body, whose releases are dated, tagged
  and semver-numbered, and whose binding decisions carry sector-wide obligation
  dates. That release stream is the only changelog this API has, so it is
  captured here with its provenance stated plainly.
