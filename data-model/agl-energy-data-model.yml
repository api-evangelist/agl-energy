cross_holder:
  secondary_data_holder: AEMO
  supplies: [nationalMeteringId and NMI standing data, metering data / interval reads]
  note: >-
    Part of the service point and usage graph is not AGL's data at all — AGL
    requests it from AEMO under the same consumer consent. Errors propagated from
    AEMO carry isSecondaryDataHolderError: true.
