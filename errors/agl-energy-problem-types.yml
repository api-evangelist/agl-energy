also_defined_by_the_standard:
  note: >-
    Codes the CDS defines for authenticated data holders that are not enumerated
    in the response descriptions of these two documents but that an Accredited
    Data Recipient will encounter against AGL's consumer endpoints.
  codes:
  - {status: 401, code: 'urn:au-cds:error:cds-all:Authorisation/Invalid', title: Invalid Authorisation}
  - {status: 403, code: 'urn:au-cds:error:cds-all:Authorisation/AdrStatusNotActive', title: ADR Status Is Not Active}
  - {status: 403, code: 'urn:au-cds:error:cds-all:Authorisation/RevokedConsent', title: Consent Is Revoked}
  - {status: 403, code: 'urn:au-cds:error:cds-all:Authorisation/InvalidConsent', title: Consent Is Invalid}
  - {status: 404, code: 'urn:au-cds:error:cds-all:Resource/NotFound', title: Resource Not Found}
  - {status: 404, code: 'urn:au-cds:error:cds-all:Resource/NotImplemented', title: Resource Not Implemented}
  - {status: 422, code: 'urn:au-cds:error:cds-all:Authorisation/InvalidArrangement', title: Invalid Consent Arrangement}
  - {status: '4xx', code: 'urn:au-cds:error:cds-all:GeneralError/Expected', title: Expected Error Encountered}
  - {status: '5xx', code: 'urn:au-cds:error:cds-all:GeneralError/Unexpected', title: Unexpected Error Encountered}
  - {status: 503, code: 'urn:au-cds:error:cds-all:Service/Unavailable', title: Service Unavailable, note: 'used during the scheduled outages AGL publishes at /discovery/outages'}
