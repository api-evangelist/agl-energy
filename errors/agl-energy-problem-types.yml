- status: 422
  code: urn:au-cds:error:cds-energy:Authorisation/UnavailableEnergyAccount
  title: Unavailable Energy Account
  detail: An account id supplied in the POST request body is temporarily unavailable.
  operations: 3
  applies_to: [listEnergyAccountBalancesSpecificAccounts, listEnergyInvoicesForSpecificAccounts, listEnergyAccountBillingForSpecificAccounts]
- status: 422
  code: urn:au-cds:error:cds-energy:Authorisation/InvalidServicePoint
  title: Invalid Service Point
  detail: A service point id supplied in the POST request body is permanently unavailable.
  operations: 2
  applies_to: [listElectricityUsageForServicePoints, listElectricityDERForSpecificServicePoints]
- status: 422
  code: urn:au-cds:error:cds-energy:Authorisation/UnavailableServicePoint
