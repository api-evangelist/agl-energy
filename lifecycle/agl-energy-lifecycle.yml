  - {outageTime: '2026-08-15T14:00:00Z', duration: PT8H, isPartial: false}
  - {outageTime: '2026-08-22T14:00:00Z', duration: PT8H, isPartial: false}
  - {outageTime: '2026-08-29T14:00:00Z', duration: PT8H, isPartial: false}
  explanation_text: >-
    "AGL CDR Consent flow will be unavailable. Customer will be unable to
    register and create new arrangements for CDR."
  significance: >-
    AGL-authored operational text naming its own CDR consent flow. This is the
    strongest single piece of evidence that the implementation is operated, not
    merely designated — an organisation does not schedule recurring maintenance
    for a consent flow it has not built.

sla:
  published: false
  note: >-
    No public SLA or uptime target. Availability is a regulatory obligation under
    the CDR performance requirements (the ACCC and the DSB publish data holder
    performance reporting), not a commercial commitment AGL offers to developers.
  regulator_reporting: https://www.cdr.gov.au/

deprecated_operations:
  count: 0
  note: >-
    No operation in either harvested specification carries deprecated: true. The
    CDS deprecates whole endpoint *versions* through the obligations schedule
    rather than flagging deprecation inside the OpenAPI document.

surface_lifecycle:
  designated: '2022'
  product_data_live_from: '2022-10-01'
  consumer_data_live_from: '2022-11-15'
  note: >-
    AGL was in the first tranche of designated energy data holders, alongside
    AEMO and Origin.
  platform_migration:
    partner: Kaluza
    detail: >-
      AGL took a ~20 percent stake in Kaluza in 2024 (~A$150m) and is migrating
      about four million consumer electricity and gas services onto the Kaluza
      platform. The retail system of record behind these mandated endpoints is
      being rebuilt on a third party's energy operating system, which is the
      most likely source of future change to this surface.
