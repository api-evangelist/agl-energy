  - provider docs
server:
  name: agl-energy
  transport: http
  url: null
  published: false
gating_note: Any real MCP server over this surface splits into two very different halves. The four unauthenticated
  tools (status, outages, list/get energy plans) could run anonymously today. The other 23 tools require
  an Accredited Data Recipient identity — CDR Register certificates, mutual TLS, a FAPI 1.0 Advanced token
  and a live consumer consent — so an MCP server exposing them would have to carry the ADR credentials
  and bind each session to one consumer's consent arrangement. That is a consent-broker design problem,
  not a wrapper.
