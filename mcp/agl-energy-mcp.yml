description: 'AGL publishes no Model Context Protocol server, and none exists for the Consumer Data Right
  more broadly. Searched on 2026-07-27: the AGL CDR public base URI answers 404 for every non-CDS path,
  the AGLEnergy GitHub org holds one unrelated repository (log4jscanlinux), and no MCP registry, npm @modelcontextprotocol
  package or docs page names AGL. The tool list below is a CANDIDATE surface derived one-per-operation
  from the Consumer Data Standards contracts AGL implements — a proposal, not a published server.'
