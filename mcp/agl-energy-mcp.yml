description: >-
  AGL publishes no Model Context Protocol server, and none exists for the
  Consumer Data Right more broadly. Searched on 2026-07-27: the AGL CDR public
  base URI answers 404 for every non-CDS path, the AGLEnergy GitHub org holds one
  unrelated repository (log4jscanlinux), and no MCP registry, npm
  @modelcontextprotocol package or docs page names AGL. The tool list below is a
  CANDIDATE surface derived one-per-operation from the Consumer Data Standards
  contracts AGL implements — a proposal, not a published server.
searched:
  hosted_server_found: false
  probes:
  - {url: 'https://public.cdr.agl.com.au/mcp', status: 404}
  - {url: 'https://public.cdr.agl.com.au/graphql', status: 404}
  - {url: 'https://github.com/AGLEnergy', status: 200, note: 'one public repo, log4jscanlinux; no MCP, SDK or spec artifacts'}
  registries_checked: [npm, PyPI, MCP registry, provider docs]
server:
  name: agl-energy
  transport: http
  url: null
  published: false
gating_note: >-
  Any real MCP server over this surface splits into two very different halves.
  The four unauthenticated tools (status, outages, list/get energy plans) could
  run anonymously today. The other 23 tools require an Accredited Data Recipient
  identity — CDR Register certificates, mutual TLS, a FAPI 1.0 Advanced token and
  a live consumer consent — so an MCP server exposing them would have to carry
  the ADR credentials and bind each session to one consumer's consent
  arrangement. That is a consent-broker design problem, not a wrapper.
