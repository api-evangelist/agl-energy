- target: $.tags
  update:
  - name: Energy Plans
    description: >-
      Anonymous Product Reference Data. For AGL these two operations are served
      centrally by the AER, not by AGL — the structural break from CDR banking.
    x-apievangelist-access: public
  - name: Electricity Service Points
    description: Consumer-authorised. Requires energy:electricity.servicepoints.*:read.
    x-apievangelist-access: adr-consent
  - name: Electricity Usage
    description: Consumer-authorised. Requires energy:electricity.usage:read. Interval metering data is sourced from AEMO as secondary data holder.
    x-apievangelist-access: adr-consent
  - name: Distributed Energy Resources
    description: Consumer-authorised. Requires energy:electricity.der:read. Solar, battery and inverter register.
    x-apievangelist-access: adr-consent
  - name: Energy Accounts
    description: Consumer-authorised. Requires energy:accounts.*:read.
    x-apievangelist-access: adr-consent
  - name: Energy Account Balances
    description: Consumer-authorised. Requires energy:billing:read.
    x-apievangelist-access: adr-consent
  - name: Energy Account Billing
    description: Consumer-authorised. Requires energy:billing:read.
    x-apievangelist-access: adr-consent
