      200 on 2026-07-27 (1,343 plans, 135 pages).
    x-apievangelist-auth: none
    x-apievangelist-operated-by: Australian Energy Regulator
    x-apievangelist-verified: '2026-07-27'
  - url: https://public.cdr.agl.com.au/cds-au/v1
    description: >-
      AGL's own CDR public base URI. Serves only the CDR Common discovery
      endpoints; returns HTTP 404 for every /energy/* path.
    x-apievangelist-auth: none
    x-apievangelist-operated-by: AGL Energy
- target: $.paths['/energy/plans'].get
