actions:
  apisYmlCreated: true
  openapiHarvested: 2
  fabricationCheck: >-
    No host, endpoint, scope or specification was invented. Every URL in apis.yml
    is either a live 200 verified above, a standards/regulator document, or a
    canonical AGL human URL explicitly recorded here as 403-unreadable. The
    eleven CDR scopes listed were extracted from the harvested specifications, not
    recalled. No baseURL was recorded for the consumer-data API because AGL does
    not publish one.
