findings:
  summary: >-
    AGL is the cleanest available proof that a statutory data mandate is
    replicable across sectors — and also the clearest evidence that replicating
    the mandate does not replicate the market. The Consumer Data Right was moved
    intact from banking to energy: same Act, same regulator, same Data Standards
    Body, same FAPI security profile, same specification shape. On AGL it is
    genuinely live, and that was proven by calling it, not by reading about it.
    But every API AGL has, it has because it was told to. There is no developer
    portal, no first-party OpenAPI, no SDK, no self-serve key, one abandoned
    GitHub org, and a corporate website that returns 403 to any machine. The
    company's entire public machine-readable footprint is the standard's
    footprint. Two further asymmetries matter: the open half of the mandate was
    centralised away from the retailer (the AER serves AGL's 1,343 plans, AGL
    serves none of them), and the closed half is gated behind accreditation so
    tightly that "the data is available" and "a developer can get it" are not the
    same sentence. Meanwhile AGL is moving four million customer services onto
    Kaluza — so the system of record behind these mandated endpoints is being
    replaced by a third party's platform, which is where any real API capability
    at AGL will end up living.
  mandateIsNotImplementation: >-
    Recorded as separate facts throughout. Designation: verified from the ACCC
    CDR Register. Implementation: verified from live 200 responses on two
    conformant endpoint families plus AGL-authored consent-flow outage notices.
    Claims: AGL's own CDR policy and help pages could not be read at all (403) and
    were given no evidentiary weight.
  contrastWithBanking: >-
    Banking: each ADI serves its own unauthenticated Product Reference Data from
    its own domain, and several publish first-party renderings of the CDS
    specification on their own developer portals. Energy: PRD is centralised at
    the AER, retailers publish nothing of their own, and no energy retailer
    developer portal exists at AGL. Same mandate, thinner surface.
  kaluza: >-
    In 2024 AGL took a roughly 20 percent stake in Kaluza (approximately A$150m /
    US$100m) and committed around A$300m over four years to migrate about four
    million consumer electricity and gas customer services onto the Kaluza
    platform. Large business customers are excluded. AGL had previously migrated
    OVO Energy Australia's customers to Kaluza in 2023. Relevant here because the
    retail data layer that answers CDR requests is being rebuilt on someone else's
    energy operating system.

