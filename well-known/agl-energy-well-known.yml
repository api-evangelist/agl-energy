  Live anonymous HTTP probes on 2026-07-27 of every host AGL's APIs are served
  from, plus the corporate and developer-portal hosts. No /.well-known/ document
  of any kind was found. Recorded as evidence — absence is a real result, not a
  gap in the harvest.
description: >-
  AGL publishes no /.well-known/ discovery surface. This is expected under the
  Consumer Data Right: a data holder's OIDC / authorisation-server metadata is
  distributed to Accredited Data Recipients through the CDR Register (and
  retrieved with CDR Register-issued certificates), not exposed anonymously on
  the open internet. The AGL public CDR base URI serves only the two
  unauthenticated Consumer Data Standards discovery endpoints under /cds-au/v1,
  and returns nginx 404 for everything else. www.agl.com.au is bot-blocked at the
  Akamai edge and returns 403 to every machine client, including for
  /.well-known/security.txt.
